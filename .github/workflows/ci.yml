name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # NFR-SEC-1: build the web app and scan everything the browser downloads for keys / secret env names.
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @juri/web build
      - run: pnpm scan:bundle

  # T7.2/T7.7: the deploy image builds from a clean checkout and serves SNAPSHOT mode with no keys and no .env.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t assay-backend .
      - name: smoke test (no .env, no keys)
        run: |
          docker run -d --name assay -p 8787:8787 assay-backend
          for i in $(seq 1 60); do curl -fsS localhost:8787/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8787/api/health
          curl -fsS localhost:8787/api/meta | grep -q '"mode":"snapshot"'
          curl -fsS 'localhost:8787/api/insights?window=all' | grep -q '"M1"'
          curl -fsS localhost:8787/api/agents?limit=1 | grep -q '"data"'
          curl -fsS localhost:8787/skill.md | grep -q 'create_job'
          echo "--- container log (tail)"; docker logs assay 2>&1 | tail -n 15
      - if: failure()
        run: docker logs assay || true

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      # Same pinned, sha256-checked cargo-near as contracts/Dockerfile.build.
      - name: install cargo-near 0.23.0
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-near" && cd "$RUNNER_TEMP/cargo-near"
          base=https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0
          curl -fsSLO $base/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO $base/cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar xzf cargo-near-x86_64-unknown-linux-gnu.tar.gz
          find . -type f -name cargo-near -exec mv {} ~/.cargo/bin/ \;
          cargo near --version
      # res/ is gitignored; the integration tests deploy this build.
      - name: build contracts/juri wasm
        working-directory: contracts/juri
        run: |
          cargo near build non-reproducible-wasm
          mkdir -p res && cp target/near/juri.wasm res/juri.wasm && ls -l res/juri.wasm
      # contracts/juri: unit tests. contracts/juri-it: near-workspaces integration tests on a local
      # sandbox (04 §11), Linux only; deploys contracts/juri/res/juri.wasm built above.
      - name: cargo test (contracts)
        run: |
          for d in contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then (cd "$d" && cargo test); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: juri-wasm
          path: contracts/juri/res/juri.wasm

  # T7.1: full lifecycle on a local NEAR sandbox with the real jury runner and RECORDED jurors (no key).
  e2e:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: juri-wasm
          path: contracts/juri/res
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
