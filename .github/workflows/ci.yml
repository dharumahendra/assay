name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # contracts/juri: unit tests. contracts/juri-it: near-workspaces integration tests on a local
      # sandbox (04 §11), Linux only; deploys the committed contracts/juri/res/juri.wasm.
      - name: cargo test (contracts)
        run: |
          for d in contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then (cd "$d" && cargo test); fi
          done
