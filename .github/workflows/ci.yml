name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      # Same pinned, sha256-checked cargo-near as contracts/Dockerfile.build.
      - name: install cargo-near 0.23.0
        run: |
          cd /tmp
          base=https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0
          curl -fsSLO $base/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO $base/cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar xzf cargo-near-x86_64-unknown-linux-gnu.tar.gz
          find /tmp -type f -name cargo-near -exec mv {} ~/.cargo/bin/ \;
          cargo near --version
      # res/ is gitignored; the integration tests deploy this build.
      - name: build contracts/juri wasm
        working-directory: contracts/juri
        run: cargo near build non-reproducible-wasm && ls -l res/juri.wasm
      # contracts/juri: unit tests. contracts/juri-it: near-workspaces integration tests on a local
      # sandbox (04 §11), Linux only; deploys contracts/juri/res/juri.wasm built above.
      - name: cargo test (contracts)
        run: |
          for d in contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then (cd "$d" && cargo test); fi
          done
