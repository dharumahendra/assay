[package]
name = "juri"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Juri: escrow + AI jury (commit-reveal) + reputation for NEAR AI Agent Market jobs (docs/04-SMART-CONTRACT-SPEC.md)."
repository = "https://github.com/juri/juri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
