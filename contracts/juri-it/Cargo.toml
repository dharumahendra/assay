[package]
name = "juri-it"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "near-workspaces integration tests for the juri contract (04 §11). Linux/macOS only: the NEAR sandbox has no Windows build. Runs in CI."

# Kept outside contracts/juri so `cargo test` there (unit tests) doesn't pull the sandbox on Windows.

[dev-dependencies]
near-workspaces = "0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
